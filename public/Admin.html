<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FUNDEDPRO - Trade With Our Capital</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#08080a;color:#fff;line-height:1.6}
.hero{padding:90px 20px;text-align:center;background:radial-gradient(800px circle at 50% -10%, #2a1a5a 0%, #08080a 60%)}
.badge{background:#1a1a1a;border:1px solid #333;padding:7px 16px;border-radius:100px;font-size:13px}
.hero h1{font-size:clamp(32px,6vw,58px);font-weight:800;max-width:750px;margin:20px auto;line-height:1.1} .acc{color:#8b5cf6}
.btn{background:#8b5cf6;padding:16px 32px;border-radius:12px;color:#fff;text-decoration:none;font-weight:700;display:inline-block;margin-top:24px}
.wrap{max-width:1150px;margin:auto;padding:0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin:40px 0}
.card{background:#141416;border:1px solid #222;padding:22px;border-radius:16px}
.pop{border-color:#8b5cf6;transform:scale(1.03);background:#181428}
.wallet{max-width:640px;margin:80px auto;background:#141416;border:1px solid #8b5cf6;border-radius:20px;padding:32px;text-align:center}
.mono{font-family:monospace;background:#000;padding:14px;border-radius:10px;word-break:break-all;margin-top:14px;display:block}
</style>
</head>
<body>
<section class="hero">
<div class="badge" id="badge"></div>
<h1><span id="title"></span> <span class="acc" id="accent"></span></h1>
<p id="subtitle" style="color:#9ca3af;max-width:620px;margin:16px auto"></p>
<a href="#packages" class="btn">Get Funded Now →</a>
</section>

<div class="wrap">
<div id="stats" class="grid"></div>
<h2 style="margin-top:70px;font-size:28px">Why Traders Choose Us</h2>
<div id="benefits" class="grid"></div>
<h2 style="margin-top:70px;font-size:28px">How It Works</h2>
<div id="steps" class="grid"></div>
<h2 style="margin-top:70px;font-size:28px;text-align:center" id="packagesTitle">Choose Your Account</h2>
<div id="packages" class="grid"></div>

<div class="wallet">
<h3>Pay with <span id="net"></span></h3>
<p style="color:#9ca3af;font-size:14px;margin-top:8px">Send exact amount and contact support</p>
<img id="qr" style="width:220px;margin:20px auto;display:none;border-radius:14px">
<span class="mono" id="addr"></span>
</div>

<h2 style="margin-top:70px">What Traders Say</h2>
<div id="testi" class="grid"></div>
<h2 style="margin-top:70px">FAQ</h2>
<div id="faq"></div>
<p id="footer" style="text-align:center;color:#666;margin:80px 0 30px"></p>
</div>

<script>
fetch('/api/data').then(r=>r.json()).then(d=>{
badge.textContent=d.hero.badge; title.textContent=d.hero.title; accent.textContent=d.hero.accent; subtitle.textContent=d.hero.subtitle;
stats.innerHTML=d.stats.map(s=>`<div class="card"><h2 style="font-size:32px">${s.number}</h2><p style="color:#9ca3af">${s.label}</p></div>`).join('');
benefits.innerHTML=d.benefits.map(b=>`<div class="card"><h3>${b.icon} ${b.title}</h3><p style="color:#9ca3af;margin-top:8px">${b.desc}</p></div>`).join('');
steps.innerHTML=d.steps.map((s,i)=>`<div class="card"><div style="width:36px;height:36px;background:#8b5cf6;border-radius:100px;display:flex;align-items:center;justify-content:center;font-weight:800">${i+1}</div><h3 style="margin-top:12px">${s.title}</h3><p style="color:#9ca3af">${s.desc}</p></div>`).join('');
packages.innerHTML=d.packages.map(p=>`<div class="card ${p.popular?'pop':''}">${p.popular?'<div style="background:#8b5cf6;display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;margin-bottom:10px">MOST POPULAR</div>':''}<h3>${p.name}</h3><h1 style="font-size:36px;margin:8px 0">${p.size}</h1><h2 style="color:#8b5cf6">${p.price}</h2><p style="color:#9ca3af">${p.profitSplit} Split</p><ul style="list-style:none;margin:18px 0">${p.features.map(f=>`<li style="margin:6px 0">✓ ${f}</li>`).join('')}</ul><a class="btn" style="width:100%;text-align:center">Select Account</a></div>`).join('');
net.textContent=d.wallet.network; addr.textContent=d.wallet.address;
if(d.wallet.qrImage){qr.src=d.wallet.qrImage; qr.style.display='block';}
testi.innerHTML=d.testimonials.map(t=>`<div class="card"><div style="display:flex;gap:12px;align-items:center"><div style="width:44px;height:44px;background:#222;border-radius:100px;display:flex;align-items:center;justify-content:center">${t.initials}</div><div><b>${t.name}</b><br><small style="color:#9ca3af">${t.role}</small></div></div><p style="margin-top:14px;color:#ccc">"${t.text}"</p></div>`).join('');
faq.innerHTML=d.faq.map(f=>`<div class="card"><b>${f.q}</b><p style="color:#9ca3af;margin-top:8px">${f.a}</p></div>`).join('');
footer.textContent=d.footer;
document.title=d.siteName;
});
</script>
</body>
</html>
