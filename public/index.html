<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUNDEDPRO</title>
<style>body{background:#05070d;color:#fff;font-family:Arial;padding:0;margin:0} .container{max-width:1100px;margin:auto;padding:20px} .hero{text-align:center;padding:60px 20px} .badge{display:inline-block;background:#0d1220;border:1px solid #1c2333;padding:6px 12px;border-radius:20px;color:#00e5a0;font-size:13px} h1{font-size:42px;line-height:1.1;margin:16px 0} h1 span{color:#00e5a0} .btn{display:inline-block;background:#00e5a0;color:#000;padding:14px 28px;border-radius:10px;font-weight:800;text-decoration:none;margin-top:14px} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px} .card{background:#0d1220;border:1px solid #1c2333;border-radius:14px;padding:18px} .price{font-size:28px;font-weight:800;color:#00e5a0} #footer{text-align:center;color:#6b7280;padding:30px;margin-top:30px;border-top:1px solid #1c2333}</style></head><body>
<div class="container">
<div class="hero">
<div class="badge" id="badge">🔒 Trusted by 2,400+ Traders</div>
<h1 id="title">Trade With Our Capital. <span id="accent">Keep Up To 92% Profit.</span></h1>
<p id="subtitle" style="color:#8892a6;max-width:600px;margin:10px auto">Skip the evaluation stress — get instantly funded accounts up to $100,000 and start trading today.</p>
<a href="#packs" class="btn">Get Funded Now</a>
<div class="grid" id="stats" style="margin-top:30px"></div>
</div>

<h2>Why Choose Us</h2><div class="grid" id="benefits"></div>
<h2 style="margin-top:30px">How It Works</h2><div class="grid" id="steps"></div>
<h2 style="margin-top:30px" id="packs">Packages</h2><div class="grid" id="packages"></div>

<div id="footer">© 2026 FundedPro — All rights reserved.</div>
</div>
<script>
fetch('/api/data').then(r=>r.json()).then(d=>{
 document.getElementById('badge').innerText=d.hero?.badge||'';
 document.getElementById('title').innerHTML=(d.hero?.title||'Trade With Our Capital.')+' <span>'+(d.hero?.accent||'Keep Up To 92% Profit.')+'</span>';
 document.getElementById('subtitle').innerText=d.hero?.subtitle||'';
 document.getElementById('footer').innerText=d.footer||'';
 document.getElementById('stats').innerHTML=(d.stats||[]).map(s=>`<div class="card"><div style="font-size:22px;font-weight:800;color:#00e5a0">${s.number}</div><div style="color:#8892a6">${s.label}</div></div>`).join('');
 document.getElementById('benefits').innerHTML=(d.benefits||[]).map(b=>`<div class="card"><div style="font-size:24px">${b.icon}</div><b>${b.title}</b><div style="color:#8892a6;font-size:13px;margin-top:6px">${b.desc}</div></div>`).join('');
 document.getElementById('steps').innerHTML=(d.steps||[]).map((s,i)=>`<div class="card"><b>${i+1}. ${s.title}</b><div style="color:#8892a6;font-size:13px">${s.desc}</div></div>`).join('');
 document.getElementById('packages').innerHTML=(d.packages||[]).map(p=>`<div class="card" style="${p.popular?'border-color:#00e5a0':''}"><b>${p.name}</b> ${p.popular?'<span style="background:#00e5a0;color:#000;padding:2px 6px;border-radius:10px;font-size:10px">POPULAR</span>':''}<div style="color:#8892a6">${p.size} • ${p.profitSplit}</div><div class="price">${p.price}</div><div style="font-size:12px;color:#8892a6">${(p.features||[]).join(' • ')}</div></div>`).join('');
});
</script></body></html>
