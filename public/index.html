:root{--green:#00ff88;--bg:#06080a;--card:#0f1216;--border:#1c2128;--text2:#8b919c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:#fff;overflow-x:hidden}
a{text-decoration:none}

/* TABS */
.tabs{display:flex;gap:0;background:#0a0d11;border-bottom:1px solid var(--border);padding:0 16px;overflow:auto}
.tabs div{padding:14px 18px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent;color:var(--text2)}
.tabs .active{color:var(--green);border-color:var(--green)}

/* HEADER */
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;max-width:1200px;margin:0 auto;width:100%}
.logo{font-weight:900;font-size:20px;letter-spacing:1.2px}
.logo span{color:var(--green)}
.icon{width:38px;height:38px;background:#151a21;border:1px solid var(--border);border-radius:50%;display:grid;place-items:center}

/* TICKER */
.ticker{background:#090b0e;border-top:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;gap:28px;padding:9px 16px;overflow:auto;white-space:nowrap;font-size:11.5px;color:var(--text2)}
.ticker b{color:#fff}.ticker .green{color:var(--green)}

/* HERO */
.hero{max-width:1200px;margin:0 auto;padding:38px 20px 20px;text-align:center;position:relative}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.22);color:var(--green);padding:6px 14px;border-radius:99px;font-size:11px;font-weight:600;margin-bottom:18px}
.hero h1{font-size:clamp(28px,6vw,48px);font-weight:900;line-height:1.1;max-width:700px;margin:0 auto}
.hero h1 .g{color:var(--green)}
.hero p{color:var(--text2);font-size:clamp(13px,2.5vw,16px);max-width:520px;margin:16px auto;line-height:1.6}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn1{background:var(--green);color:#000;padding:14px 24px;border-radius:12px;font-weight:800;font-size:14px;box-shadow:0 0 30px rgba(0,255,136,.3)}
.btn2{border:1px solid #242a33;color:#fff;padding:14px 24px;border-radius:12px;font-weight:600;font-size:14px;background:rgba(255,255,255,.03)}
