<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MTF Funded Trader</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070d;--card:#0d1220;--border:#1c2333;--accent:#00e5a0;--accent2:#3b82f6;--text:#fff;--muted:#8892a6}
*{margin:0;padding:0;box-sizing:border-box} body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif;overflow-x:hidden}

/* LIVE MOVING BACKGROUND - ہلنے والا بیک گراؤنڈ */
.bg-wrap{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:0.6;animation:float 12s ease-in-out infinite}
.orb1{width:600px;height:600px;background:radial-gradient(circle, rgba(0,229,160,0.22), transparent 70%);top:-150px;left:-150px;animation-delay:0s}
.orb2{width:700px;height:700px;background:radial-gradient(circle, rgba(59,130,246,0.18), transparent 70%);bottom:-200px;right:-150px;animation-delay:2s}
.orb3{width:500px;height:500px;background:radial-gradient(circle, rgba(0,229,160,0.12), transparent 70%);top:40%;left:50%;animation-delay:4s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,40px) scale(1.1)}66%{transform:translate(-40px,60px) scale(0.95)}}

header{position:sticky;top:0;z-index:10;background:rgba(5,7,13,0.7);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 22px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:Space Grotesk;font-weight:700} .logo span{color:var(--accent)}

.hero{text-align:center;padding:80px 20px 20px}
.badge{display:inline-block;background:var(--card);border:1px solid var(--border);padding:6px 14px;border-radius:100px;color:var(--accent);font-size:12px;animation:fadeIn 0.8s}
h1{font-family:Space Grotesk;font-size:50px;line-height:1.05;margin:16px auto;max-width:700px;animation:fadeUp 0.9s} h1 span{color:var(--accent);text-shadow:0 0 30px rgba(0,229,160,0.5)}
.sub{color:var(--muted);max-width:600px;margin:12px auto;line-height:1.6;animation:fadeUp 1s}
.btn{display:inline-block;margin-top:18px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#000;padding:14px 30px;border-radius:12px;font-weight:800;text-decoration:none;box-shadow:0 10px 30px rgba(0,229,160,0.3);transition:0.3s;animation:fadeUp 1.1s}
.btn:hover{transform:translateY(-3px);box-shadow:0 20px 40px rgba(0,229,160,0.45)}

.container{max-width:1100px;margin:auto;padding:0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:24px}
.card{background:linear-gradient(180deg, rgba(13,18,32,0.95), rgba(13,18,32,0.6));border:1px solid var(--border);border-radius:16px;padding:18px;backdrop-filter:blur(12px);transition:all 0.4s;animation:fadeUp 0.8s both}
.card:hover{transform:translateY(-6px);border-color:rgba(0,229,160,0.4);box-shadow:0 15px 40px rgba(0,0,0,0.4)}
.price{font-size:30px;font-weight:800;color:var(--accent);margin:6px 0}
.title{font-family:Space Grotesk;font-size:26px;margin:50px 0 10px}
@keyframes fadeUp{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style></head><body>
<div class="bg-wrap"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>

<header><div class="logo">MTF <span>FUNDED</span> TRADER</div><div style="font-size:12px;color:var(--muted)">LIVE 3D</div></header>

<div class="hero">
<div class="badge" id="badge">🔒 Trusted by 2,400+ Traders</div>
<h1 id="hTitle">Trade With Our Capital. <span id="hAcc">Keep Up To 92% Profit.</span></h1>
<p class="sub" id="hSub">Skip the evaluation stress — get instantly funded accounts up to $100,000 and start trading today.</p>
<a href="#packs" class="btn">Get Funded Now</a>
<div class="grid" id="stats"></div>
</div>

<div class="container">
<div class="title">Why Choose Us</div><div class="grid" id="benefits"></div>
<div class="title">How It Works</div><div class="grid" id="steps"></div>
<div class="title" id="packs">Packages</div><div class="grid" id="packages"></div>
<div style="text-align:center;color:#555;padding:40px 0" id="footer"></div>
</div>

<script>
fetch('/api/data').then(r=>r.json()).then(d=>{
 document.getElementById('badge').innerText=d.hero?.badge||'🔒 Trusted by 2,400+ Traders';
 document.getElementById('hTitle').innerHTML=(d.hero?.title||'Trade With Our Capital.')+' <span>'+(d.hero?.accent||'Keep Up To 92% Profit.')+'</span>';
 document.getElementById('hSub').innerText=d.hero?.subtitle||'';
 document.getElementById('footer').innerText=d.footer||'© 2026 FundedPro';
 if(d.siteSettings?.primaryColor) document.documentElement.style.setProperty('--accent',d.siteSettings.primaryColor);
 document.getElementById('stats').innerHTML=(d.stats||[]).map((s,i)=>`<div class="card" style="animation-delay:${i*0.1}s"><div style="font-size:24px;font-weight:800;color:var(--accent)">${s.number}</div><div style="color:var(--muted);font-size:13px">${s.label}</div></div>`).join('');
 document.getElementById('benefits').innerHTML=(d.benefits||[]).map((b,i)=>`<div class="card" style="animation-delay:${i*0.1}s"><div style="font-size:26px">${b.icon}</div><b>${b.title}</b><div style="color:var(--muted);font-size:13px;margin-top:6px">${b.desc}</div></div>`).join('');
 document.getElementById('steps').innerHTML=(d.steps||[]).map((s,i)=>`<div class="card" style="animation-delay:${i*0.1}s"><div style="background:var(--accent);color:#000;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px;margin-bottom:8px">${i+1}</div><b>${s.title}</b><div style="color:var(--muted);font-size:13px">${s.desc}</div></div>`).join('');
 document.getElementById('packages').innerHTML=(d.packages||[]).map((p,i)=>`<div class="card" style="animation-delay:${i*0.1}s;${p.popular?'border-color:var(--accent)':''}"><b>${p.name}</b> ${p.popular?'<span style="background:var(--accent);color:#000;padding:2px 8px;border-radius:20px;font-size:10px">POPULAR</span>':''}<div style="color:var(--muted);font-size:12px">${p.size} • ${p.profitSplit}</div><div class="price">${p.price}</div><div style="color:var(--muted);font-size:12px">${(p.features||[]).join(' • ')}</div></div>`).join('');
}).catch(()=>{});
</script></body></html>
