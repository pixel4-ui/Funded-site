<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title>
<style>body{background:#05070d;color:#fff;font-family:Arial;padding:16px;max-width:700px;margin:auto}input{width:100%;padding:11px;margin:6px 0;background:#0d1220;border:1px solid #1c2333;color:#fff;border-radius:8px}button{padding:10px 14px;background:#00e5a0;color:#000;border:none;border-radius:8px;font-weight:800;cursor:pointer;margin:4px}img.qr{width:120px;height:120px;background:#fff;border-radius:8px;display:block;margin:8px 0}.box{background:#0d1220;padding:12px;border-radius:10px;margin:12px 0;border:1px solid #1c2333}</style>
</head><body>
<h2 style="color:#00e5a0;text-align:center">MTF ADMIN - FINAL</h2>
<div id="login"><input type="password" id="pwd" value="Admin7610"><button id="btnLogin">LOGIN KRO</button><div id="msg">Ready</div></div>
<div id="main" style="display:none">
<div class="box"><h4>Wallets + QR Upload</h4><div id="walletsList"></div><button id="btnAddW">+ Add Wallet</button><button id="btnSaveW" style="background:#3b82f6">Save Wallets</button></div>
<div class="box"><h4>Brokers - Exness</h4><div id="brokersList"></div><button id="btnAddB">+ Add Exness</button><button id="btnSaveB">Save Brokers</button></div>
<div class="box"><h4>Orders - I Paid Proofs</h4><button id="btnLoadOrders" style="background:#00e5a0">Load Orders</button><div id="ordersList"></div></div>
<a href="/" style="color:#00e5a0;display:block;text-align:center;margin-top:12px">View Site</a>
</div>
<script>
let pass="";let data=null;
document.getElementById("btnLogin").onclick=async function(){
  let p=document.getElementById("pwd").value;
  document.getElementById("msg").innerText="Checking...";
  try{let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p})});let j=await r.json();if(!r.ok) throw new Error(j.error);pass=p;localStorage.setItem("adminPass",p);document.getElementById("login").style.display="none";document.getElementById("main").style.display="block";let r2=await fetch("/api/data");data=await r2.json();showWallets();showBrokers();}catch(e){document.getElementById("msg").innerText=e.message;}
};
function showWallets(){let h="";for(let i=0;i<(data.wallets||[]).length;i++){let w=data.wallets[i];h+='<div class="box"><input id="w-net-'+i+'" value="'+(w.network||'').replace(/"/g,'')+'" placeholder="Network"><input id="w-addr-'+i+'" value="'+(w.address||'')+'" placeholder="Address">'+(w.qrImage?'<img class="qr" src="'+w.qrImage+'">':'<div style="color:#8892a6;font-size:11px">No QR</div>')+'<input type="file" accept="image/*" onchange="uploadQR('+i+',this)"><input type="hidden" id="w-qr-'+i+'"></div>';}document.getElementById("walletsList").innerHTML=h;setTimeout(()=>{for(let i=0;i<(data.wallets||[]).length;i++){let el=document.getElementById("w-qr-"+i);if(el) el.value=data.wallets[i].qrImage||"";}},100);}
window.uploadQR=function(i,input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{document.getElementById("w-qr-"+i).value=e.target.result;alert("QR Loaded! Save dabao");};r.readAsDataURL(f);};
document.getElementById("btnAddW").onclick=function(){data.wallets.push({network:"USDT TRC20 (Exness)",address:"",qrImage:null});showWallets();};
document.getElementById("btnSaveW").onclick=async function(){let arr=[];for(let i=0;i<data.wallets.length;i++){let net=document.getElementById("w-net-"+i).value;let addr=document.getElementById("w-addr-"+i).value;let qr=document.getElementById("w-qr-"+i).value||data.wallets[i].qrImage||null;arr.push({network:net,address:addr,qrImage:qr});}let r=await fetch("/api/admin/save",{method:"POST",headers:{"Content-Type":"application/json","x-admin-password":pass},body:JSON.stringify({section:"wallets",value:arr})});let j=await r.json();if(!r.ok) alert(j.error);else{alert("Wallets Saved");data.wallets=arr;}};
function showBrokers(){let h="";for(let i=0;i<(data.brokers||[]).length;i++){h+='<div style="display:flex;gap:6px;margin:4px 0"><input id="b-'+i+'" value="'+data.brokers[i].name+'" style="flex:1"><button onclick="data.brokers.splice('+i+',1);showBrokers()" style="width:auto">X</button></div>';}document.getElementById("brokersList").innerHTML=h;}
document.getElementById("btnAddB").onclick=function(){data.brokers.unshift({name:"Exness"});showBrokers();};
document.getElementById("btnSaveB").onclick=async function(){let arr=[];for(let i=0;i<data.brokers.length;i++){arr.push({name:document.getElementById("b-"+i).value});}let r=await fetch("/api/admin/save",{method:"POST",headers:{"Content-Type":"application/json","x-admin-password":pass},body:JSON.stringify({section:"brokers",value:arr})});let j=await r.json();if(!r.ok) alert(j.error);else alert("Brokers Saved");};
document.getElementById("btnLoadOrders").onclick=async function(){let r=await fetch("/api/admin/orders",{headers:{"x-admin-password":pass}});let orders=await r.json();let h="";orders.forEach(o=>{h+='<div class="box"><b>'+o.customerName+'</b> - '+o.customerEmail+'<br>Package: '+(o.package?.name||'')+' '+ (o.package?.price||'')+'<br>Tx: '+(o.txId||'N/A')+'<br><img class="qr" style="width:200px;height:auto" src="'+o.screenshot+'"><br><small>'+new Date(o.createdAt).toLocaleString()+'</small></div>';});document.getElementById("ordersList").innerHTML=h||'No orders';};
</script></body></html>
