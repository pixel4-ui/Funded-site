<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin</title>
<style>body{background:#050a05;color:#fff;font-family:sans-serif;padding:16px;max-width:1000px;margin:auto}input,textarea{width:100%;padding:11px;margin:6px 0;background:#111;border:1px solid #00ff8822;color:#fff;border-radius:8px}button{background:#00ff88;color:#000;padding:10px 18px;border:none;border-radius:8px;font-weight:900;cursor:pointer;margin:4px}.btn-outline{background:transparent;color:#00ff88;border:1px solid #00ff88}.box{background:#0f1a0f;padding:18px;border-radius:14px;margin:14px 0;border:1px solid #ffffff0a}.item{border:1px solid #ffffff10;padding:12px;border-radius:10px;margin:8px 0;background:#00000033}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}h3{color:#00ff88}</style>
</head><body>
<h1 style="color:#00ff88">FUNDEDPRO ADMIN - FIXED</h1>
<div id="loginBox"><input type="password" id="pass" placeholder="Password default Admin7610"><button onclick="login()">LOGIN</button><p id="loginMsg" style="color:#f55"></p></div>
<div id="panel" style="display:none">
<div style="display:flex;gap:10px"><button onclick="load()">Reload</button><button class="btn-outline" onclick="logout()">Logout</button><a href="/" style="color:#00ff88;padding:10px">View Site</a></div>
<div class="box"><h3>Site + Hero</h3>Site Name:<input id="siteName">Badge:<input id="heroBadge">Title:<input id="heroTitle">Accent:<input id="heroAccent">Subtitle:<textarea id="heroSub"></textarea>Footer:<input id="footer"><button onclick="saveHero()">Save All</button></div>
<div class="box"><h3>Stats</h3><div id="statsEditor"></div><button onclick="addStat()">+ Add</button><button onclick="saveSection('stats', getStats())">Save Stats</button></div>
<div class="box"><h3>Packages (Buy Now)</h3><div id="packagesEditor"></div><button onclick="addPackage()">+ Add Package</button><button onclick="saveSection('packages', getPackages())">Save Packages</button></div>
<div class="box"><h3>Brokers</h3><div id="brokersEditor"></div><button onclick="addBroker()">+ Add Broker</button><button onclick="saveSection('brokers', getBrokers())">Save Brokers</button></div>
<div class="box"><h3>Wallets - TRC20/BEP20 + QR</h3><div id="walletsEditor"></div><button onclick="addWallet()">+ Add Wallet</button><button onclick="saveSection('wallets', getWallets())">Save Wallets</button></div>
<div class="box"><h3>Testimonials</h3><div id="testimonialsEditor"></div><button onclick="addTestimonial()">+ Add</button><button onclick="saveSection('testimonials', getTestimonials())">Save</button></div>
<div class="box"><h3>FAQ</h3><div id="faqEditor"></div><button onclick="addFaq()">+ Add FAQ</button><button onclick="saveSection('faq', getFaq())">Save FAQ</button></div>
<div class="box"><h3>Change Password</h3><input type="password" id="newPass" placeholder="New password min 6"><button onclick="changePass()">Change</button></div>
<p id="msg"></p>
</div>
<script>
let SITE_DATA=null,adminPass=localStorage.getItem('adminPass')||'';
if(adminPass) document.getElementById('pass').value=adminPass;
async function api(path,opts={}){opts.headers=opts.headers||{}; if(adminPass) opts.headers['x-admin-password']=adminPass; opts.headers['Content-Type']='application/json'; let res=await fetch(path,opts); let d=await res.json().catch(()=>({})); if(!res.ok) throw new Error(d.error||'Error'); return d;}
async function login(){let p=document.getElementById('pass').value; try{let res=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})}); let d=await res.json(); if(!res.ok) throw new Error(d.error); adminPass=p; localStorage.setItem('adminPass',p); document.getElementById('loginBox').style.display='none'; document.getElementById('panel').style.display='block'; await load();}catch(e){document.getElementById('loginMsg').innerText=e.message;}}
function logout(){localStorage.removeItem('adminPass'); location.reload();}
async function load(){try{let res=await fetch('/api/data'); SITE_DATA=await res.json(); document.getElementById('siteName').value=SITE_DATA.siteName||''; document.getElementById('heroBadge').value=SITE_DATA.hero?.badge||''; document.getElementById('heroTitle').value=SITE_DATA.hero?.title||''; document.getElementById('heroAccent').value=SITE_DATA.hero?.accent||''; document.getElementById('heroSub').value=SITE_DATA.hero?.subtitle||''; document.getElementById('footer').value=SITE_DATA.footer||''; renderStats(); renderPackages(); renderBrokers(); renderWallets(); renderTestimonials(); renderFaq(); document.getElementById('msg').innerText='Loaded';}catch(e){document.getElementById('msg').innerText='Load fail '+e.message}}
async function saveSection(section,value){try{document.getElementById('msg').innerText='Saving '+section+'...'; await api('/api/admin/save',{method:'POST',body:JSON.stringify({section,value})}); document.getElementById('msg').innerText='✅ '+section+' saved!';}catch(e){document.getElementById('msg').innerText='❌ '+e.message}}
function saveHero(){saveSection('siteName',siteName.value); saveSection('hero',{badge:heroBadge.value,title:heroTitle.value,accent:heroAccent.value,subtitle:heroSub.value}); saveSection('footer',footer.value);}
function renderStats(){let h='';(SITE_DATA.stats||[]).forEach((s,i)=>{h+=`<div class="item"><div class="row"><input placeholder="Number" value="${s.number||''}" data-i="${i}" data-k="number" class="stat-in"><input placeholder="Label" value="${s.label||''}" data-i="${i}" data-k="label" class="stat-in"></div><button class="btn-outline" onclick="removeStat(${i})">Remove</button></div>`}); document.getElementById('statsEditor').innerHTML=h;}
function getStats(){let arr=[]; document.querySelectorAll('.stat-in').forEach(el=>{let i=el.dataset.i,k=el.dataset.k; if(!arr[i]) arr[i]={}; arr[i][k]=el.value;}); return arr;}
function addStat(){SITE_DATA.stats.push({number:"",label:""}); renderStats();}
function removeStat(i){SITE_DATA.stats.splice(i,1); renderStats();}
function renderPackages(){let h='';(SITE_DATA.packages||[]).forEach((p,i)=>{h+=`<div class="item"><div class="row"><input placeholder="ID" value="${p.id||''}" data-i="${i}" data-k="id" class="pkg-in"><input placeholder="Name" value="${p.name||''}" data-i="${i}" data-k="name" class="pkg-in"></div><div class="row"><input placeholder="Size" value="${p.size||''}" data-i="${i}" data-k="size" class="pkg-in"><input placeholder="Price" value="${p.price||''}" data-i="${i}" data-k="price" class="pkg-in"></div><div class="row"><input placeholder="Profit Split" value="${p.profitSplit||''}" data-i="${i}" data-k="profitSplit" class="pkg-in"><label><input type="checkbox" ${p.popular?'checked':''} data-i="${i}" data-k="popular" class="pkg-check"> Popular?</label></div><textarea placeholder="Features comma separated" data-i="${i}" data-k="features" class="pkg-in">${(p.features||[]).join(', ')}</textarea><button class="btn-outline" onclick="removePackage(${i})">Remove</button></div>`}); document.getElementById('packagesEditor').innerHTML=h;}
function getPackages(){let arr=[]; document.querySelectorAll('.pkg-in,.pkg-check').forEach(el=>{let i=el.dataset.i; if(!arr[i]) arr[i]={}; let k=el.dataset.k; if(k==='features') arr[i][k]=el.value.split(',').map(s=>s.trim()).filter(Boolean); else if(el.type==='checkbox') arr[i][k]=el.checked; else arr[i][k]=el.value;}); return arr;}
function addPackage(){SITE_DATA.packages.push({id:Date.now().toString(),name:"New Package",size:"$10,000",price:"$99",profitSplit:"80%",features:["Instant"]}); renderPackages();}
function removePackage(i){SITE_DATA.packages.splice(i,1); renderPackages();}
function renderBrokers(){let h='';(SITE_DATA.brokers||[]).forEach((b,i)=>{h+=`<div class="item"><input value="${b.name||''}" data-i="${i}" class="broker-in"><button class="btn-outline" onclick="removeBroker(${i})">Remove</button></div>`}); document.getElementById('brokersEditor').innerHTML=h;}
function getBrokers(){let arr=[]; document.querySelectorAll('.broker-in').forEach(el=>{arr.push({name:el.value});}); return arr;}
function addBroker(){SITE_DATA.brokers.push({name:"New Broker"}); renderBrokers();}
function removeBroker(i){SITE_DATA.brokers.splice(i,1); renderBrokers();}
function renderWallets(){let h='';(SITE_DATA.wallets||[]).forEach((w,i)=>{h+=`<div class="item"><input placeholder="Network" value="${w.network||''}" data-i="${i}" data-k="network" class="wallet-in"><input placeholder="Address" value="${w.address||''}" data-i="${i}" data-k="address" class="wallet-in"><input placeholder="QR Image URL" value="${w.qrImage||''}" data-i="${i}" data-k="qrImage" class="wallet-in"><button class="btn-outline" onclick="removeWallet(${i})">Remove</button></div>`}); document.getElementById('walletsEditor').innerHTML=h;}
function getWallets(){let arr=[]; document.querySelectorAll('.wallet-in').forEach(el=>{let i=el.dataset.i,k=el.dataset.k; if(!arr[i]) arr[i]={}; arr[i][k]=el.value; if(k==='qrImage'&&!el.value) arr[i][k]=null;}); return arr;}
function addWallet(){SITE_DATA.wallets.push({network:"USDT TRC20",address:"YOUR_ADDRESS",qrImage:null}); renderWallets();}
function removeWallet(i){SITE_DATA.wallets.splice(i,1); renderWallets();}
function renderTestimonials(){let h='';(SITE_DATA.testimonials||[]).forEach((t,i)=>{h+=`<div class="item"><div class="row"><input placeholder="Initials" value="${t.initials||''}" data-i="${i}" data-k="initials" class="test-in"><input placeholder="Name" value="${t.name||''}" data-i="${i}" data-k="name" class="test-in"></div><input placeholder="Role" value="${t.role||''}" data-i="${i}" data-k="role" class="test-in"><textarea placeholder="Text" data-i="${i}" data-k="text" class="test-in">${t.text||''}</textarea><button class="btn-outline" onclick="removeTestimonial(${i})">Remove</button></div>`}); document.getElementById('testimonialsEditor').innerHTML=h;}
function getTestimonials(){let arr=[]; document.querySelectorAll('.test-in').forEach(el=>{let i=el.dataset.i,k=el.dataset.k; if(!arr[i]) arr[i]={}; arr[i][k]=el.value;}); return arr;}
function addTestimonial(){SITE_DATA.testimonials.push({initials:"NT",name:"New Trader",role:"Funded",text:"Great!"}); renderTestimonials();}
function removeTestimonial(i){SITE_DATA.testimonials.splice(i,1); renderTestimonials();}
function renderFaq(){let h='';(SITE_DATA.faq||[]).forEach((f,i)=>{h+=`<div class="item"><input placeholder="Question" value="${f.q||''}" data-i="${i}" data-k="q" class="faq-in"><textarea placeholder="Answer" data-i="${i}" data-k="a" class="faq-in">${f.a||''}</textarea><button class="btn-outline" onclick="removeFaq(${i})">Remove</button></div>`}); document.getElementById('faqEditor').innerHTML=h;}
function getFaq(){let arr=[]; document.querySelectorAll('.faq-in').forEach(el=>{let i=el.dataset.i,k=el.dataset.k; if(!arr[i]) arr[i]={}; arr[i][k]=el.value;}); return arr;}
function addFaq(){SITE_DATA.faq.push({q:"New?",a:"Answer"}); renderFaq();}
function removeFaq(i){SITE_DATA.faq.splice(i,1); renderFaq();}
async function changePass(){let np=document.getElementById('newPass').value; if(np.length<6){alert('Min 6');return;} try{await api('/api/admin/change-password',{method:'POST',body:JSON.stringify({newPassword:np})}); alert('Changed!'); adminPass=np; localStorage.setItem('adminPass',np);}catch(e){alert(e.message);}}
if(adminPass) login();
</script></body></html>
