<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin - FUNDEDPRO</title>
<style>body{background:#050a05;color:#fff;font-family:sans-serif;padding:20px}input,textarea{width:100%;padding:12px;margin:8px 0;background:#111;border:1px solid #00ff8822;color:#fff;border-radius:8px}button{background:#00ff88;color:#000;padding:12px 24px;border:none;border-radius:8px;font-weight:900;cursor:pointer} .box{background:#0f1a0f;padding:20px;border-radius:15px;margin:15px 0;border:1px solid #ffffff0a}</style>
</head><body>
<h1 style="color:#00ff88">FUNDEDPRO SUPER ADMIN</h1>
<div id="login"><input type="password" id="pass" placeholder="Enter Admin Password"><button onclick="login()">LOGIN</button></div>
<div id="panel" style="display:none">
<div class="box"><h3>Main Settings</h3>Site Name: <input id="siteName">Hero Title: <input id="heroTitle">Hero Sub: <textarea id="heroSub"></textarea>Users: <input id="users">Payout: <input id="payout"></div>
<div class="box"><h3>Payment TRC20</h3>TRC20 Address: <input id="trc20">QR Image URL (or keep qrserver link): <input id="qrImage"></div>
<div class="box"><h3>Plans JSON</h3><textarea id="plans" rows="6"></textarea><small>Format: [{"price":"$89","account":"$15,000","profit":"90%"}]</small></div>
<div class="box"><h3>Reviews JSON</h3><textarea id="reviews" rows="6"></textarea></div>
<div class="box"><h3>FAQ JSON</h3><textarea id="faq" rows="6"></textarea></div>
<button onclick="save()" style="width:100%;padding:16px;font-size:18px">💾 SAVE ALL CHANGES - UPDATE LIVE SITE</button><p id="msg"></p>
</div>
<script>
let config={};
function login(){if(document.getElementById('pass').value!=='Admin7610'){alert('Wrong!');return} document.getElementById('login').style.display='none'; document.getElementById('panel').style.display='block'; load();}
async function load(){let r=await fetch('/api/config'); config=await r.json(); document.getElementById('siteName').value=config.siteName; document.getElementById('heroTitle').value=config.heroTitle; document.getElementById('heroSub').value=config.heroSub; document.getElementById('users').value=config.users; document.getElementById('payout').value=config.payout; document.getElementById('trc20').value=config.trc20; document.getElementById('qrImage').value=config.qrImage; document.getElementById('plans').value=JSON.stringify(config.plans,null,2); document.getElementById('reviews').value=JSON.stringify(config.reviews,null,2); document.getElementById('faq').value=JSON.stringify(config.faq,null,2);}
async function save(){try{let newConfig={siteName:siteName.value,heroTitle:heroTitle.value,heroSub:heroSub.value,users:users.value,payout:payout.value,trc20:trc20.value,qrImage:qrImage.value,plans:JSON.parse(plans.value),reviews:JSON.parse(reviews.value),faq:JSON.parse(faq.value)}; let res=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(newConfig)}); if(res.ok){document.getElementById('msg').innerText='✅ LIVE SITE UPDATED! Go to your site and refresh.'} }catch(e){alert('JSON error check Plans/Reviews/FAQ format: '+e)}}
</script></body></html>
