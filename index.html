<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FUNDEDPRO</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#08080a;color:#fff;line-height:1.6}.hero{padding:80px 20px;text-align:center;background:radial-gradient(600px at 50% 0%,#2a1a5a,#08080a)}.btn{background:#8b5cf6;padding:14px 28px;border-radius:10px;color:#fff;text-decoration:none;display:inline-block;margin-top:20px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;max-width:1100px;margin:40px auto;padding:0 20px}.card{background:#141416;border:1px solid #222;padding:20px;border-radius:14px}</style></head><body><section class="hero"><h1 id="t"></h1><p id="s" style="color:#aaa;max-width:600px;margin:15px auto"></p><a href="#pkgs" class="btn">Get Funded Now</a></section><div id="stats" class="grid"></div><div id="ben" class="grid"></div><div id="pkgs" class="grid"></div><script>fetch('/api/data').then(r=>r.json()).then(d=>{t.textContent=d.hero.title+' '+d.hero.accent;s.textContent=d.hero.subtitle;stats.innerHTML=d.stats.map(x=>`<div class=card><h2>${x.number}</h2><p>${x.label}</p></div>`).join('');ben.innerHTML=d.benefits.map(b=>`<div class=card><h3>${b.icon} ${b.title}</h3><p style=color:#aaa>${b.desc}</p></div>`).join('');pkgs.innerHTML=d.packages.map(p=>`<div class=card style=border:${p.popular?'2px solid #8b5cf6':''}><h3>${p.name}</h3><h1>${p.size}</h1><h2 style=color:#8b5cf6>${p.price}</h2><p>${p.profitSplit}</p><a class=btn style=width:100%;text-align:center;margin-top:12px>Select</a></div>`).join('')})</script></body></html>
